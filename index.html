<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Basislager</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Basislager">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECE7DF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111813" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app. Lowercase wordmark bar → greeting hero card → icon stat tiles → soft rounded cards holding hairline lists; floating rounded tab bar with raised scan button.
   Light = "calm kit" (ivory, sage, sand, slate). Dark = "green glass" (deep forest, blurred leaves, pale sage + tan). */
:root{
  --bg:#ECE7DF; --bg2:#E3DDD2;
  --card:rgba(250,247,242,.78); --card-solid:#F8F5F0; --raised:#FDFBF8; --sunk:#E4DED4;
  --line:rgba(70,66,52,.12); --hair:rgba(70,66,52,.09);
  --ink:#1F2723; --muted:#6C756E; --faint:#9BA39C;
  --accent:#5E7A64; --accent-2:#7F9A84; --accent-soft:#DDE5D9; --on-accent:#F7F5F0;
  --brass:#B98C66; --brass-soft:#F1E3D4;
  --slate:#3D4A5C; --slate-soft:#DCE1E6; --mist:#8D9DA2;
  --bad:#A4553A; --bad-soft:#F3DDD3;
  --leaf1:#7E9A7F; --leaf2:#A9BBA0; --leaf3:#C9A887; --leafA:.42;
  --hero1:#2F3D35; --hero2:#46594C; --on-hero:#F1EEE6;
  --nav:rgba(250,247,242,.94); --t-sage:#DCE6D9; --t-tan:#F0E3D3; --t-slate:#DDE3E8;
  --shadow:0 1px 0 rgba(255,255,255,.75) inset,0 2px 6px rgba(60,52,38,.05),0 14px 34px -14px rgba(60,52,38,.26);
  --shadow-lg:0 1px 0 rgba(255,255,255,.8) inset,0 24px 50px -18px rgba(50,44,32,.35);
  --blur:16px;
  --display:"Cormorant Garamond","Cormorant",Garamond,Georgia,serif;
  --sans:"Jost","Avenir Next",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111813; --bg2:#18221B;
  --card:rgba(214,230,208,.065); --card-solid:#1C261F; --raised:rgba(214,230,208,.10); --sunk:rgba(214,230,208,.07);
  --line:rgba(214,230,208,.12); --hair:rgba(214,230,208,.08);
  --ink:#EAEFE6; --muted:#A3B0A5; --faint:#6F7C72;
  --accent:#BCCDA9; --accent-2:#94AE90; --accent-soft:rgba(188,205,169,.16); --on-accent:#16201A;
  --brass:#D4AB82; --brass-soft:rgba(212,171,130,.16);
  --slate:#9FB0C4; --slate-soft:rgba(159,176,196,.14); --mist:#7F9196;
  --bad:#E79A7E; --bad-soft:rgba(231,154,126,.15);
  --leaf1:#2E4A35; --leaf2:#3F6146; --leaf3:#5A4A35; --leafA:.85;
  --hero1:rgba(214,230,208,.10); --hero2:rgba(214,230,208,.04); --on-hero:#EAEFE6;
  --nav:rgba(26,36,29,.92); --t-sage:rgba(188,205,169,.13); --t-tan:rgba(212,171,130,.13); --t-slate:rgba(159,176,196,.12);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -18px rgba(0,0,0,.7);
  --shadow-lg:0 1px 0 rgba(255,255,255,.06) inset,0 30px 60px -20px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111813; --bg2:#18221B;
  --card:rgba(214,230,208,.065); --card-solid:#1C261F; --raised:rgba(214,230,208,.10); --sunk:rgba(214,230,208,.07);
  --line:rgba(214,230,208,.12); --hair:rgba(214,230,208,.08);
  --ink:#EAEFE6; --muted:#A3B0A5; --faint:#6F7C72;
  --accent:#BCCDA9; --accent-2:#94AE90; --accent-soft:rgba(188,205,169,.16); --on-accent:#16201A;
  --brass:#D4AB82; --brass-soft:rgba(212,171,130,.16);
  --slate:#9FB0C4; --slate-soft:rgba(159,176,196,.14); --mist:#7F9196;
  --bad:#E79A7E; --bad-soft:rgba(231,154,126,.15);
  --leaf1:#2E4A35; --leaf2:#3F6146; --leaf3:#5A4A35; --leafA:.85;
  --hero1:rgba(214,230,208,.10); --hero2:rgba(214,230,208,.04); --on-hero:#EAEFE6;
  --nav:rgba(26,36,29,.92); --t-sage:rgba(188,205,169,.13); --t-tan:rgba(212,171,130,.13); --t-slate:rgba(159,176,196,.12);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -18px rgba(0,0,0,.7);
  --shadow-lg:0 1px 0 rgba(255,255,255,.06) inset,0 30px 60px -20px rgba(0,0,0,.8);
  color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:linear-gradient(170deg,var(--bg) 0%,var(--bg2) 100%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--sans);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));max-width:620px;margin:0 auto}
.eyebrow,.label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:var(--muted)}

/* ambient leaves */
#leaves{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;filter:blur(34px) saturate(1.05);opacity:var(--leafA)}
.light{display:none}
header,main,#gate{position:relative;z-index:1}

/* glass card primitive */
.card,.stat,.studio,.rcard,.empty,.notice,.hero,.searchbox,.bar-nav .navin{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.2);backdrop-filter:blur(var(--blur)) saturate(1.2)}

/* header bar */
header .wrap{padding-block:14px 4px;display:grid;gap:18px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px}
.wordmark{font-family:var(--sans);font-weight:500;font-size:22px;letter-spacing:-.01em;color:var(--ink);display:flex;align-items:center;gap:8px}
.wordmark svg{width:22px;height:22px;color:var(--accent)}
.hright{display:flex;gap:8px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:19px;height:19px}
.boxchip{display:inline-flex;align-items:center;gap:4px;background:var(--brass-soft);color:var(--brass);border-radius:999px;padding:5px 5px 5px 12px;font-size:12px;font-weight:500;letter-spacing:.04em;max-width:52vw}
.boxchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boxchip button{border:0;background:transparent;color:inherit;width:22px;height:22px;border-radius:50%;font-size:15px;line-height:1}
.titleblock{display:grid;gap:4px}
h1{font-family:var(--display);font-weight:500;font-size:44px;line-height:1;letter-spacing:-.005em;margin:0;text-wrap:balance}
.sub-h{color:var(--muted);font-size:15px;margin:0;max-width:42ch}

main{padding-block:18px calc(200px + env(safe-area-inset-bottom,0px));display:grid;gap:18px;align-content:start}
.notice{border-radius:18px;padding:14px 16px;font-size:14px;color:var(--muted)}
.notice strong{color:var(--ink)}

/* hero (greeting) */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 20px;background:linear-gradient(140deg,var(--hero1),var(--hero2));color:var(--on-hero);box-shadow:var(--shadow-lg);display:grid;gap:14px;min-height:190px}
.hero .eyebrow{color:var(--on-hero);opacity:.7}
.hero h2{font-family:var(--display);font-weight:500;font-size:36px;line-height:1.02;margin:0;max-width:11ch;text-wrap:balance}
.hero p{margin:0;font-size:14px;opacity:.82;max-width:24ch}
.hero .btnrow{margin-top:4px;position:relative;z-index:1}
.hero .btn{border-color:rgba(241,238,230,.35);color:var(--on-hero);background:rgba(241,238,230,.08)}
.hero .btn.primary{background:var(--on-hero);border-color:var(--on-hero);color:#26322B}
.hero svg.plant{position:absolute;right:-6px;bottom:-4px;width:150px;height:170px;pointer-events:none;opacity:.95}
.hero > *:not(svg){position:relative;z-index:1}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:22px;padding:14px 12px 13px;display:grid;gap:8px;text-align:left;color:var(--ink)}
.stat .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--raised);box-shadow:var(--shadow)}
.stat .ic svg{width:18px;height:18px}
.stat .k{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.01em}
.stat .v{font-family:var(--sans);font-size:28px;line-height:1;font-weight:500;letter-spacing:-.02em}
.stat .s{font-size:11px;color:var(--muted)}
.stat:nth-child(1){background:var(--t-sage)} .stat:nth-child(1) .ic{color:var(--accent)}
.stat:nth-child(2){background:var(--t-tan)} .stat:nth-child(2) .ic{color:var(--brass)}
.stat:nth-child(3){background:var(--t-slate)} .stat:nth-child(3) .ic{color:var(--slate)}
button.stat:active{transform:scale(.98)}

/* cards & rows */
section{display:grid;gap:10px}
section.card{border-radius:24px;padding:16px 16px 6px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 2px 6px}
.ghead h2{font-family:var(--sans);font-size:11px;font-weight:500;margin:0;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.ghead .num{font-size:12px;color:var(--faint)}
.rows{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--hair);min-height:60px}
.rows .row:first-child{border-top:0}
.row .main{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0;display:grid;gap:6px}
.row .name{font-weight:500;font-size:16px;overflow-wrap:anywhere}
.row .meta{font-size:12.5px;color:var(--muted)}
.meta .soon{color:var(--brass);font-weight:500}
.meta .gone{color:var(--bad);font-weight:500}
.bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;max-width:190px;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:999px}
.bar.low i{background:linear-gradient(90deg,var(--brass),#D9B48F)}
.bar.out i{background:var(--bad)}
.qty{display:flex;align-items:center;gap:4px}
.count{font-variant-numeric:tabular-nums;font-size:15px;min-width:48px;text-align:center;color:var(--ink);font-weight:500}
.count small{color:var(--faint);font-size:12px;font-weight:400}
.count.low{color:var(--brass)} .count.out{color:var(--bad)}
.step{width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:var(--raised);box-shadow:var(--shadow);font-size:17px;line-height:1;display:grid;place-items:center;color:var(--ink)}
.step:active{transform:scale(.94)}

.searchbox{display:flex;align-items:center;gap:10px;border-radius:999px;padding:4px 16px}
.searchbox svg{width:18px;height:18px;color:var(--muted);flex:none}
.search{width:100%;border:0;background:transparent;padding:10px 0;font-size:16px;min-width:0}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none}

.check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--faint);background:transparent;display:grid;place-items:center;flex:none;color:var(--on-accent);font-size:14px}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.row.done .name{text-decoration:line-through;color:var(--faint)}
.need{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);text-align:right;white-space:nowrap}
.tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--brass);background:var(--brass-soft);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:2px}

.btn{border:1px solid var(--line);background:var(--raised);box-shadow:var(--shadow);border-radius:999px;padding:11px 20px;font-weight:500;font-size:15px;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);background:transparent;box-shadow:none}
.btn.small{padding:8px 15px;font-size:13.5px}
.btn.link{border:0;background:transparent;box-shadow:none;padding:6px 2px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.98)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar p{margin:0;color:var(--muted);font-size:14px}

.empty{padding:24px 22px;border-radius:24px;color:var(--muted);font-size:15px;display:grid;gap:12px}
.empty h3{margin:0;color:var(--ink);font-family:var(--display);font-weight:500;font-size:28px;line-height:1.05}
.empty ol{margin:0;padding-left:20px;display:grid;gap:6px}
.empty p{margin:0}

/* recipes */
.studio{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px;display:grid;gap:14px;background:linear-gradient(140deg,var(--hero1),var(--hero2));color:var(--on-hero);box-shadow:var(--shadow-lg)}
.studio h3{font-family:var(--display);font-weight:500;font-size:32px;margin:0;line-height:1.02;max-width:12ch}
.studio p{margin:0;opacity:.82;font-size:14px;max-width:34ch}
.studio > *{position:relative;z-index:1}
.studio svg.plant{position:absolute;right:-10px;top:-6px;width:120px;height:140px;z-index:0;opacity:.9}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.studio .chip{background:rgba(241,238,230,.1);border-color:rgba(241,238,230,.25);color:var(--on-hero)}
.studio .chip[aria-pressed="true"]{background:var(--on-hero);color:#26322B}
.thinking{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
.mini{display:grid;gap:6px}
.mini .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .count{min-width:30px;font-size:17px}

.rcards{display:grid;gap:12px}
.rcard{border-radius:24px;padding:18px 18px 16px;text-align:left;display:grid;gap:10px;width:100%;color:var(--ink)}
.rcard:active{transform:scale(.99)}
.rcard .rtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rcard h4{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
.rcard .rintro{color:var(--muted);font-size:14px;margin:0}
.rcard .rmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:500}
.rcard .rmeta span{background:var(--sunk);border-radius:999px;padding:3px 10px}
.rcard .rmeta b{color:var(--accent);font-weight:600}
.rbuy{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--brass-soft);color:var(--brass);font-weight:500}
.pill.meat{background:var(--bad-soft);color:var(--bad)}
.bookmark{color:var(--brass);font-size:18px;line-height:1}

/* dock: floating tab bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.modepill{pointer-events:auto;margin:0 auto 30px;width:max-content;display:flex;border-radius:999px;padding:4px}
.modepill button{border:0;background:transparent;border-radius:999px;padding:8px 18px;font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--muted)}
.modepill button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
.modepill button[data-mode="take"][aria-pressed="true"]{background:var(--brass);color:#fff}
nav.bar-nav{pointer-events:auto;max-width:592px;margin:0 auto}
.bar-nav .navin{display:grid;grid-template-columns:repeat(4,1fr);align-items:end;border-radius:26px;padding:6px;background:var(--nav)}
.navbtn{border:0;background:transparent;padding:8px 0 7px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--faint);position:relative;border-radius:18px}
.navbtn svg{width:22px;height:22px}
.navbtn[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.navbtn .dot{position:absolute;top:4px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--brass);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center}
.fabwrap{display:grid;justify-items:center}
.fab{width:64px;height:64px;margin-top:-30px;border-radius:22px;border:0;background:linear-gradient(150deg,var(--accent-2),var(--accent));color:var(--on-accent);display:grid;place-items:center;box-shadow:0 0 0 5px var(--bg),0 16px 30px -10px rgba(0,0,0,.45);transition:background .2s}
.fab.take{background:linear-gradient(150deg,#D7B08A,var(--brass));color:#fff}
.fab svg{width:28px;height:28px}
.scanrow{pointer-events:auto;max-width:592px;margin:0 auto 8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scanbig{border:0;border-radius:22px;padding:16px 12px;font-size:17px;font-weight:500;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 28px -12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.scanbig svg{width:24px;height:24px}
.scanbig.in{background:linear-gradient(150deg,var(--accent-2),var(--accent));color:var(--on-accent)}
.scanbig.out{background:linear-gradient(150deg,#D7B08A,var(--brass));color:#fff}
.scanbig:active{transform:scale(.98)}
.scanner .stitle{border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;background:#BCCDA9;color:#16201A}
.scanner .stitle.take{background:#D4AB82;color:#2A2016}
.typelink{border:0;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:500;border-radius:999px;padding:4px 10px;margin:6px 0 3px;letter-spacing:.02em;white-space:nowrap}
.typelink.take{background:var(--brass-soft);color:var(--brass)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,11,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{background:var(--card-solid);width:100%;max-width:620px;max-height:90vh;overflow-y:auto;border-radius:30px 30px 0 0;padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));display:grid;gap:18px;box-shadow:var(--shadow-lg);animation:up .26s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-family:var(--display);font-weight:500;font-size:34px;line-height:1.02;text-wrap:balance}
.sheet .lede{margin:-10px 0 0;color:var(--muted);font-size:14px}
.field{display:grid;gap:7px}
.field label,.flabel{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:16px;padding:12px 14px;min-height:50px;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.picklist{display:grid;background:var(--raised);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.picklist button{border:0;border-top:1px solid var(--hair);background:transparent;text-align:left;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.picklist button:first-child{border-top:0}
.picklist button:active{background:var(--sunk)}
.picklist .pm{font-size:12.5px;color:var(--muted);white-space:nowrap}
.picklist .new{color:var(--accent);font-weight:500}
.picked{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent-soft);border-radius:18px;padding:14px 16px}
.picked strong{font-weight:500;font-size:17px}
.picked .pm{font-size:13px;color:var(--muted)}
.bigqty{display:flex;align-items:center;justify-content:center;gap:22px;padding:6px 0}
.bigqty .step{width:52px;height:52px;border-radius:18px;font-size:24px}
.bigqty .n{font-size:44px;font-weight:500;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.btn.wide{width:100%;justify-content:center;padding:15px 20px;font-size:16px}
.choice button[data-m="take"][aria-pressed="true"]{background:var(--brass);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigstep{display:flex;align-items:center;gap:12px}
.bigstep .count{font-size:26px;min-width:56px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);border-radius:16px;padding:4px}
.choice button{border:0;background:transparent;border-radius:12px;padding:10px 6px;font-weight:500;color:var(--muted);font-size:14px}
.choice button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.code{font-family:var(--mono);background:var(--sunk);border-radius:8px;padding:2px 7px;font-size:13px;overflow-wrap:anywhere}
.units{display:grid;background:var(--raised);border:1px solid var(--line);border-radius:18px;padding:0 14px}
.units div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--hair);font-size:14px}
.units div:first-child{border-top:0}
.linkbox{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.linkbox code{font-family:var(--mono);font-size:12px;background:var(--sunk);border-radius:14px;padding:10px 12px;overflow-wrap:anywhere;user-select:all}
.hint{font-size:13px;color:var(--muted);margin:0}
.ingr{display:grid;background:var(--raised);border:1px solid var(--line);border-radius:18px;padding:0 14px}
.ingr div{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:baseline;padding:11px 0;border-top:1px solid var(--hair);font-size:15px}
.ingr div:first-child{border-top:0}
.ingr .mark{font-size:12px;color:var(--accent)}
.ingr .mark.buy{color:var(--brass)}
.ingr .mark.meat{color:var(--bad)}
.ingr .amt{color:var(--muted);font-size:13px;text-align:right}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;font-size:15px;align-items:start}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
.confirm{border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;font-size:14px;background:var(--raised)}

/* toast = notification card */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(186px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--card-solid);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:10px 10px 10px 12px;display:flex;gap:12px;align-items:center;width:min(560px,calc(100% - 32px));box-shadow:var(--shadow-lg);font-size:14px}
.toast::before{content:"✓";flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:14px}
.toast span{flex:1}
.toast button{border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:999px;padding:7px 12px}
.busy{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,14,11,.3)}
.busy div{background:var(--card-solid);border-radius:20px;padding:18px 24px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;gap:12px;align-items:center}

/* gate (setup / login) */
.gate{min-height:100vh;display:grid;align-content:center;gap:22px;padding-block:40px}
.gate .mark{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(150deg,var(--accent-2),var(--accent));color:var(--on-accent);box-shadow:var(--shadow-lg)}
.gate .mark svg{width:30px;height:30px}
.gate h1{font-size:56px}
.gate .card{border-radius:28px;padding:22px 20px;display:grid;gap:16px}
.gate .err{color:var(--bad);font-size:14px;margin:0}

/* live scanner */
.scanner{position:fixed;inset:0;z-index:60;background:#0b0f0c;color:#EEF0E8;display:grid;grid-template-rows:auto 1fr auto}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner .shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 20% at 50% 46%,transparent 98%,rgba(11,15,12,.6) 100%)}
.scanner .frame{position:absolute;left:9%;right:9%;top:36%;height:20%;pointer-events:none;border-radius:22px;box-shadow:0 0 0 1.5px rgba(238,240,232,.7) inset;transition:box-shadow .15s}
.scanner .frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;border-radius:2px;background:#D4AB82;box-shadow:0 0 16px 3px rgba(212,171,130,.7);animation:sweep 1.8s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-32px)}50%{transform:translateY(32px)}}
@media (prefers-reduced-motion:reduce){.scanner .frame::after{animation:none}}
.scanner .frame.hit{box-shadow:0 0 0 3px #BCCDA9 inset,0 0 44px rgba(188,205,169,.6)}
.scanner .top,.scanner .bottom{position:relative;z-index:2;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.scanner .top{padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(rgba(11,15,12,.7),transparent);padding-bottom:30px}
.scanner .bottom{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;justify-items:center;background:linear-gradient(transparent,rgba(11,15,12,.85));padding-top:40px}
.scanner .sbtn{border:1px solid rgba(238,240,232,.25);background:rgba(238,240,232,.12);color:#EEF0E8;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:500;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.scanner .smode{display:flex;background:rgba(238,240,232,.12);border:1px solid rgba(238,240,232,.2);border-radius:999px;padding:3px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.scanner .smode button{border:0;background:transparent;color:rgba(238,240,232,.75);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500}
.scanner .smode button[aria-pressed="true"]{background:#BCCDA9;color:#16201A}
.scanner .smode button[data-mode="take"][aria-pressed="true"]{background:#D4AB82;color:#2A2016}
.scanner .status{min-height:58px;max-width:520px;width:100%;text-align:center;font-size:15px;display:grid;place-items:center;padding:12px 16px;border-radius:22px}
.scanner .status.show{background:rgba(238,240,232,.14);border:1px solid rgba(238,240,232,.2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.scanner .status .big{font-family:var(--display);font-size:26px;line-height:1.1;font-weight:500}
.scanner .hintline{font-size:13px;opacity:.8;text-align:center;max-width:32ch}
.scanner .errbox{position:relative;z-index:2;align-self:center;justify-self:center;max-width:340px;text-align:center;display:grid;gap:12px;padding:20px}
.scanner .top{grid-row:1}
.scanner .errbox{grid-row:2}
.scanner .bottom{grid-row:3;align-self:end}
.scanner .bottom > *{align-self:end}

.field label.btn{font-size:13.5px;letter-spacing:normal;text-transform:none;color:var(--ink);cursor:pointer}

</style>
</head>

function drawLeaves(){
  const c = $("#leaves"); if(!c) return;
  const dpr = Math.min(2, window.devicePixelRatio||1), w = innerWidth, h = innerHeight;
  c.width = Math.round(w*dpr/2); c.height = Math.round(h*dpr/2);
  const x = c.getContext("2d"); x.setTransform(dpr/2,0,0,dpr/2,0,0); x.clearRect(0,0,w,h);
  const cs = getComputedStyle(document.documentElement);
  const cols = [cs.getPropertyValue("--leaf1").trim(), cs.getPropertyValue("--leaf2").trim(), cs.getPropertyValue("--leaf3").trim()];
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const leaf = (cx,cy,len,wid,rot,col) => { x.save(); x.translate(cx,cy); x.rotate(rot); x.beginPath(); x.moveTo(0,0);
    x.bezierCurveTo(wid,-len*.25,wid*.8,-len*.75,0,-len); x.bezierCurveTo(-wid*.8,-len*.75,-wid,-len*.25,0,0); x.fillStyle = col; x.fill(); x.restore(); };
  // clusters at top-right and bottom-left, like foliage at the frame edge
  for(let i=0;i<9;i++) leaf(w*(0.78+rnd()*0.35), h*(rnd()*0.28), 160+rnd()*180, 50+rnd()*50, Math.PI*(0.55+rnd()*0.9), cols[i%2]);
  for(let i=0;i<9;i++) leaf(w*(-0.15+rnd()*0.3), h*(0.72+rnd()*0.32), 170+rnd()*190, 55+rnd()*50, Math.PI*(-0.35+rnd()*0.7), cols[i%2]);
  x.globalAlpha = .7; leaf(w*0.95, h*0.62, 220, 70, Math.PI*1.25, cols[2]); leaf(w*0.05, h*0.3, 180, 60, Math.PI*0.2, cols[2]);
}

/* ================= data layer: Supabase table kv(collection,id,data) ================= */
function makeDb(sb){
  const cache = new Map();            // collection -> Map(id -> data)
  const colL = new Map(), docL = new Map();
  let loaded = false;
  const col = c => { if(!cache.has(c)) cache.set(c,new Map()); return cache.get(c); };
  const snapCol = c => ({ docs:[...col(c)].map(([id,d])=>({id, exists:true, data:()=>d})) });
  const snapDoc = (c,id) => { const d = col(c).get(id); return { id, exists: d!==undefined, data:()=>d }; };
  function emit(c,id){
    (colL.get(c)||new Set()).forEach(fn=>fn(snapCol(c)));
    (docL.get(c+"/"+id)||new Set()).forEach(fn=>fn(snapDoc(c,id)));
  }
  function emitAll(){ const cs = new Set([...colL.keys(), ...[...docL.keys()].map(k=>k.split("/")[0])]); cs.forEach(c=>{ (colL.get(c)||new Set()).forEach(fn=>fn(snapCol(c))); [...docL.keys()].filter(k=>k.startsWith(c+"/")).forEach(k=>docL.get(k).forEach(fn=>fn(snapDoc(c,k.split("/")[1])))); }); }
  async function loadAll(){
    const next = new Map(); let from = 0;
    for(;;){
      const { data, error } = await sb.from("kv").select("collection,id,data").range(from, from+999);
      if(error) throw error;
      data.forEach(r => { if(!next.has(r.collection)) next.set(r.collection,new Map()); next.get(r.collection).set(r.id, r.data); });
      if(data.length < 1000) break; from += 1000;
    }
    cache.clear(); next.forEach((v,k)=>cache.set(k,v)); loaded = true; emitAll();
  }
  async function write(c,id,data){
    if(data===null) col(c).delete(id); else col(c).set(id,data);
    emit(c,id);
    const q = data===null ? sb.from("kv").delete().eq("collection",c).eq("id",id)
                          : sb.from("kv").upsert({collection:c, id, data, updated_at:new Date().toISOString()});
    const { error } = await q;
    if(error){ toast("Kunne ikke gemme: "+(error.message||"ukendt fejl")+". Prøv igen."); loadAll().catch(()=>{}); throw error; }
  }
  const docRef = path => { const [c,id] = path.split("/"); return {
    id, path,
    set: d => write(c,id,JSON.parse(JSON.stringify(d))),
    delete: () => write(c,id,null),
    onSnapshot(fn){ const k=c+"/"+id; if(!docL.has(k)) docL.set(k,new Set()); docL.get(k).add(fn); if(loaded) fn(snapDoc(c,id)); return ()=>docL.get(k).delete(fn); }
  }; };
  const db = {
    doc: docRef,
    collection: c => ({ doc: id => docRef(c+"/"+(id||uid("d"))),
      onSnapshot(fn){ if(!colL.has(c)) colL.set(c,new Set()); colL.get(c).add(fn); if(loaded) fn(snapCol(c)); return ()=>colL.get(c).delete(fn); } })
  };
  sb.channel("kv-changes").on("postgres_changes",{event:"*",schema:"public",table:"kv"}, p => {
    if(p.eventType==="DELETE"){ const o=p.old||{}; if(o.collection && o.id){ col(o.collection).delete(o.id); emit(o.collection,o.id); } else loadAll().catch(()=>{}); }
    else { const r=p.new; col(r.collection).set(r.id, r.data); emit(r.collection, r.id); }
  }).subscribe();
  document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") loadAll().catch(()=>{}); });
  return { db, loadAll };
}

function noDb(){ toast("Ikke forbundet endnu."); throw new Error("no db"); }
async function saveProduct(id, body){ if(!S.db) return noDb(); await S.db.doc("products/"+id).set(body); }
const plain = o => { const {id, ...rest} = o; return JSON.parse(JSON.stringify(rest)); };

async function addUnits(pid, n, exp, box){
  const before = plain(S.products[pid]); const p = plain(S.products[pid]);
  p.units = p.units || [];
  for(let i=0;i<n;i++) p.units.push({e: exp||"", b: box||""});
  if(p.units.length >= (p.target||0)) p.cart = false;

function pickUnit(units){
  let pool = S.box ? units.filter(u=>u.b===S.box) : [];
  if(!pool.length) pool = units;
  return sortedUnits(pool)[0];
}
/* returns a message string; quiet = no toast */
async function takeUnit(pid, quiet){
  const before = plain(S.products[pid]); const p = plain(S.products[pid]);
  const units = p.units || [];
  if(!units.length){ const m = `${p.name} står ikke på lager. Den er på indkøbslisten.`; if(!quiet) toast(m); return {ok:false, msg:m, name:p.name}; }
  const pick = pickUnit(units);
  units.splice(units.indexOf(pick),1); p.units = units;
  await saveProduct(pid, p);
  S.undo = {pid, before};
  const where = [pick.b ? boxName(pick.b) : "", pick.e ? "holdbar til "+expYear(pick.e) : ""].filter(Boolean).join(", ");
  const need = Math.max(0,(p.target||0)-units.length);
  const msg = `${p.name} −1${where?" ("+where+")":""} · ${units.length} tilbage${need?" · på indkøbslisten":""}`;
  if(!quiet) toast(msg, true);
  return {ok:true, msg, name:p.name, left:units.length, need, where};
}

const OFF_CATS = [[/canned|conserves/,"Konserves"],[/pasta|rice|grains|noodle|cereal-grains|legumes|seeds/,"Pasta, ris & gryn"],[/flour|baking|sugar|yeast/,"Bagning"],[/breakfast|muesli|granola|oat/,"Morgenmad"],[/spice|herb|salt|oil|vinegar|condiment/,"Krydderier & olie"],[/sauce|dressing|ketchup|mayonnaise|mustard|pesto/,"Saucer & dressing"],[/snack|sweet|chocolate|candies|biscuit|chips/,"Snacks & søde sager"],[/beverage|drink|coffee|tea|juice|water/,"Drikkevarer"],[/frozen/,"Frost"],[/dairies|cheese|milk|yogurt|egg/,"Mejeri & æg"],[/meat|fish|poultry/,"Kød & fisk"],[/fruit|vegetable/,"Frugt & grønt"],[/bread/,"Brød"]];
async function lookup(code){
  try{
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 6000);
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_da,brands,quantity,categories_tags`, {signal:ctl.signal});
    clearTimeout(t);
    if(!r.ok) return null;
    const j = await r.json(); const p = j && j.product; if(!p) return null;
    const name = (p.product_name_da || p.product_name || "").trim();
    const tags = (p.categories_tags||[]).join(" ");
    const cat = (OFF_CATS.find(([re])=>re.test(tags))||[null,"Andet"])[1];
    if(!name) return null;
    return { name, brand:(p.brands||"").split(",")[0].trim(), qty:p.quantity||"", cat };
  }catch{ return null; }
}

const SC = { stream:null, running:false, raf:0, last:"", lastAt:0, busy:false, reader:null, audio:null, canvas:document.createElement("canvas"), track:null };
function readerInit(){
  if(SC.reader || !window.ZXing) return SC.reader;
  const F = ZXing.BarcodeFormat, h = new Map();
  h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF]);
  SC.reader = new ZXing.MultiFormatReader(); SC.reader.setHints(h);
  return SC.reader;
}
function beep(ok=true){
  try{
    if(!SC.audio) return;
    const a = SC.audio, o = a.createOscillator(), g = a.createGain();
    o.frequency.value = ok ? 1320 : 440; o.type = "sine";
    g.gain.setValueAtTime(0.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(0.18, a.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+0.14);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+0.15);
  }catch{}
}
function setScanMode(m){ setMode(m); const t=$("#scanTitle"); t.textContent = m==="take" ? "Scan ud" : "Scan ind"; t.classList.toggle("take", m==="take"); scanHint(); }
function scanHint(){ $("#scanStatus").className="status"; $("#scanStatus").innerHTML = `<span class="hintline">${S.mode==="take" ? "Scan ud: hver vare trækkes fra, så snart den scannes. Scan løs." : "Scan ind: hold stregkoden inden for rammen. Den scannes automatisk."}</span>`; }
function scanStatus(big, small){ const el=$("#scanStatus"); el.className="status show"; el.innerHTML = `<div><div class="big">${esc(big)}</div>${small?`<div style="font-size:13px;opacity:.75;margin-top:4px">${esc(small)}</div>`:""}</div>`; }

async function openScanner(){
  const sc = $("#scanner"); sc.hidden = false; $("#scanErr").hidden = true; $("#frame").hidden = false;
  setScanMode(S.mode);
  try{ SC.audio = SC.audio || new (window.AudioContext||window.webkitAudioContext)(); SC.audio.resume && SC.audio.resume(); }catch{}
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ return scanError("Kameraet kan ikke bruges i denne browser. Åbn appen i Safari via https."); }
  try{
    SC.stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080} } });
  }catch(e){
    return scanError(e && e.name==="NotAllowedError" ? "Basislager har ikke adgang til kameraet. Tillad kamera for siden i Safari (aA › Webstedsindstillinger › Kamera) og prøv igen." : "Kameraet kunne ikke startes. Luk andre apps, der bruger kameraet, og prøv igen.");
  }
  const v = $("#video"); v.srcObject = SC.stream;
  try{ await v.play(); }catch{}
  SC.track = SC.stream.getVideoTracks()[0];
  try{ const caps = SC.track.getCapabilities ? SC.track.getCapabilities() : {}; $("#torchBtn").hidden = !caps.torch;
       if(caps.focusMode && caps.focusMode.includes("continuous")) SC.track.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(()=>{}); }catch{}
  SC.running = true; SC.busy = false; loop();
}
function scanError(msg){ const e=$("#scanErr"); e.hidden=false; $("#frame").hidden=true; e.innerHTML = `<p style="margin:0">${esc(msg)}</p><button class="sbtn" id="scanErrType">Skriv koden i stedet</button>`; e.querySelector("#scanErrType").onclick = () => { closeScanner(); openTypeSheet(); }; }
function closeScanner(){
  SC.running = false; cancelAnimationFrame(SC.raf);
  if(SC.stream){ SC.stream.getTracks().forEach(t=>t.stop()); SC.stream = null; }
  $("#video").srcObject = null; $("#scanner").hidden = true; render();
}
let lastTick = 0;
function loop(ts){
  if(!SC.running) return;
  SC.raf = requestAnimationFrame(loop);
  if(SC.busy || ts - lastTick < 110) return;
  lastTick = ts;
  const v = $("#video"); if(!v.videoWidth) return;
  const code = decodeFrame(v);
  if(code) onDetected(code);
}
let flip = false;
function decodeFrame(v){
  const r = readerInit(); if(!r) return null;
  // centre band matching the on-screen frame (object-fit: cover maths kept simple: use middle 84% x 34%)
  const vw = v.videoWidth, vh = v.videoHeight;
  flip = !flip;
  const bandH = flip ? 0.34 : 0.22;
  const sw = vw*0.84, sh = vh*bandH, sx = (vw-sw)/2, sy = vh*0.46 - sh/2;
  const k = Math.min(1, 1000/sw);
  const cv = SC.canvas; cv.width = Math.round(sw*k); cv.height = Math.round(sh*k);
  const ctx = cv.getContext("2d",{willReadFrequently:true}); ctx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
  try{ return r.decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText(); }
  catch{ return null; }
}
function flash(){ const f=$("#frame"); f.classList.add("hit"); setTimeout(()=>f.classList.remove("hit"), 450); }
async function onDetected(raw){
  const code = String(raw).replace(/\s/g,"");
  const now = Date.now();
  if(code === SC.last && now - SC.lastAt < 2500) return;   // same item still in view
  SC.last = code; SC.lastAt = now; SC.busy = true;
  flash(); beep(true);
  const c = S.codes[code];
  if(c && S.products[c.pid]){
    if(S.mode === "take"){
      try{ const r = await takeUnit(c.pid, true); scanStatus(r.ok ? `${r.name} −1` : r.name, r.ok ? `${r.left} tilbage${r.need?" · på indkøbslisten":""}${r.where?" · "+r.where:""}` : "Står ikke på lager · er på indkøbslisten"); if(!r.ok) beep(false); }catch{}
      setTimeout(()=>{ SC.busy = false; }, 700);
      return;
    }
    closeScanner(); openFillSheet(c.pid, c.pack||1, true);
    return;
  }
  // unknown code: look it up
  scanStatus("Ny vare", "Slår stregkoden op…");
  const info = await lookup(code);
  closeScanner(); openNewCodeSheet(code, info);
}

/* ================= recipes ================= */
function findStock(keys){
  const ks = keys.split("|");
  const prods = productList().filter(p=>stock(p)>0);
  for(const k of ks){ const p = prods.find(p=>p.name.toLowerCase().includes(k)); if(p) return p; }
  return null;
}
function matchLibrary(){
  const out = [];
  LIB.forEach((r,idx) => {
    const uses = [], buy = [];
    r.i.forEach(([keys,label,amount,packs]) => {
      const p = findStock(keys);
      if(p) uses.push({id:p.id, amount, packs, label}); else buy.push({name:label, amount, cat:"Andet", pantry:true});
    });
    r.buy.forEach(([name,amount,cat]) => buy.push({name, amount, cat}));
    if(buy.length > 3 || uses.length < 2) return;
    // pantry items we did not find get their category from a matching product name pattern, else Andet
    out.push({ title:r.t, intro:r.intro, minutes:r.min, serves:4, tags:r.tags, uses, buy, meat: r.meat ? {name:r.meat[0], amount:r.meat[1], cat:"Kød & fisk"} : null, steps:r.s, src:idx });
  });
  return out.sort((a,b) => (a.buy.length - b.buy.length) || (b.uses.length - a.uses.length));
}
function stockForPrompt(){ return productList().filter(p=>stock(p)>0).map(p=>({id:p.id, navn:p.name, kategori:p.cat, antal:stock(p)})); }
function buildPrompt(){
  const g = S.gen;
  return `Du er en dygtig dansk hjemmekok. Foreslå 5 forskellige aftensretter, der primært laves af husstandens basislager herunder.

REGLER
- Hver ret må højst kræve 3 ekstra varer udover lageret (fx løg, citron, fløde, frisk krydderurt). Kød eller fisk tæller ikke med i de 3, men angives separat. En ret må gerne være uden kød.
- Salt, peber og vand regnes som altid til stede.
- Brug kun lagervarer, der faktisk står på listen, og henvis til dem med deres id.
- "pakker" er hvor mange HELE pakninger/enheder af lagervaren retten bruger op (0 hvis der kun bruges en lille del af en åbnet pakke).
- Retterne skal være til ${g.serves} personer.${g.style?`\n- Stil: ${g.style}.`:""}${g.wish?`\n- Ønske: ${g.wish}.`:""}
- Skriv på dansk. Kort, appetitlig intro (1 sætning). 4-7 konkrete trin.
- Kategori for ekstra varer og kød vælges blandt: ${CATS.join(", ")}.

LAGER (JSON)
${JSON.stringify(stockForPrompt())}

Svar KUN med JSON i dette format:
{"opskrifter":[{"titel":"","intro":"","minutter":30,"personer":${g.serves},"fra_lager":[{"id":"","mængde":"400 g","pakker":1}],"køb":[{"navn":"","mængde":"","kategori":""}],"kød":{"navn":"","mængde":"","kategori":"Kød & fisk"},"trin":[""]}]}
Sæt "kød" til null, hvis retten er uden kød eller fisk.`;
}
function cleanRecipe(r){
  if(!r || typeof r!=="object") return null;
  const uses = (Array.isArray(r.fra_lager)?r.fra_lager:[]).filter(u=>u && S.products[u.id]).map(u=>({id:String(u.id), amount:String(u.mængde||""), packs:Math.max(0,Math.min(5,parseInt(u.pakker)||0))}));
  const buy = (Array.isArray(r.køb)?r.køb:[]).slice(0,3).map(b=>({name:String(b.navn||"").trim(), amount:String(b.mængde||""), cat:catOf(b.kategori)})).filter(b=>b.name);
  const meat = r.kød && r.kød.navn ? {name:String(r.kød.navn), amount:String(r.kød.mængde||""), cat:catOf(r.kød.kategori||"Kød & fisk")} : null;
  const title = String(r.titel||"").trim(); if(!title || !uses.length) return null;
  return { title, intro:String(r.intro||""), minutes:parseInt(r.minutter)||0, serves:parseInt(r.personer)||S.gen.serves, uses, buy, meat, steps:(Array.isArray(r.trin)?r.trin:[]).map(String).filter(Boolean).slice(0,10) };
}
async function generate(){
  const g = S.gen, key = store.get("bl-ai-key");
  if(!key){ openSettings(); return; }
  if(!stockForPrompt().length){ g.error = "Læg nogle varer på lager først."; render(); return; }
  g.busy = true; g.error = ""; g.ctl = new AbortController(); render();
  try{
    const r = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", signal:g.ctl.signal,
      headers:{ "x-api-key":key, "anthropic-version":"2023-06-01", "content-type":"application/json", "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model:"claude-sonnet-5-5", max_tokens:6000, messages:[{role:"user", content:buildPrompt()}] }) });
    if(r.status===401) throw {code:"key"};
    if(r.status===429) throw {code:"rate"};
    if(!r.ok) throw {code:"http"};
    const j = await r.json();
    const text = (j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
    const json = JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}")+1));
    const list = (json.opskrifter||[]).map(cleanRecipe).filter(Boolean);
    if(!list.length) throw {code:"empty"};
    const doc = { items:list, at:Date.now() };
    S.suggest = doc; await S.db.doc("meta/suggestions").set(doc).catch(()=>{});
  }catch(e){
    const c = e && (e.code || e.name);
    g.error = c==="AbortError" ? "" : c==="key" ? "API-nøglen blev afvist. Tjek den under Indstillinger." : c==="rate" ? "For mange forespørgsler lige nu. Prøv igen om lidt." : c==="empty" ? "Der kom ingen brugbare forslag. Prøv igen, evt. med et andet ønske." : "Forslagene kunne ikke hentes. Tjek forbindelsen og prøv igen.";
  }finally{ g.busy = false; g.ctl = null; render(); }
}
function recipeById(key){
  const [k, v] = [key.slice(0,1), key.slice(2)];
  if(k==="l") return S.lib[+v] || null;
  if(k==="s") return S.suggest?.items?.[+v] || null;
  return S.recipes[v] || null;
}

    <div class="field"><span class="flabel">Fra basislager</span><div class="ingr">${usesOk.map(u=>{ const p=S.products[u.id]; const ok=stock(p)>=Math.max(1,u.packs); return `<div><span class="mark">${ok?"●":"○"}</span><span>${esc(p.name)}${ok?"":` <span class="hint">· ikke nok på lager</span>`}</span><span class="amt">${esc(u.amount)}</span></div>`; }).join("")}</div></div>
    ${toBuy.length?`<div class="field"><span class="flabel">Skal købes</span><div class="ingr">${toBuy.map(b=>`<div><span class="mark ${b.meat?"meat":"buy"}">+</span><span>${esc(b.name)}</span><span class="amt">${esc(b.amount)}</span></div>`).join("")}</div>
      <div class="btnrow"><button class="btn accent small" id="rBuy">Sæt ${toBuy.length} ting på indkøbslisten</button></div></div>`:""}
    ${r.steps.length?`<div class="field"><span class="flabel">Sådan gør du</span><ol class="steps">${r.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ol></div>`:""}
    <div class="btnrow"><button class="btn primary" id="rCook">Vi har lavet den</button><button class="btn" id="rSave">${sid?"Fjern fra gemte":"Gem opskrift"}</button><button class="btn" id="rClose">Luk</button></div>
    <div class="confirm" id="rConfirm" hidden><strong>Træk fra lageret?</strong><span>${usesOk.filter(u=>u.packs>0).length?usesOk.filter(u=>u.packs>0).map(u=>`${u.packs} × ${esc(S.products[u.id].name)}`).join(", ")+" tages ud og kommer på indkøbslisten.":"Retten bruger ingen hele pakker, så lageret er uændret."}</span>
      <div class="btnrow"><button class="btn accent" id="rCookYes">Ja, træk fra</button><button class="btn" id="rCookNo">Annullér</button></div></div>`, s => {
      s.querySelector("#rClose").onclick = close;
      const rb = s.querySelector("#rBuy");
      if(rb) rb.onclick = async () => {
        const existing = Object.values(S.extras).map(x=>x.name.toLowerCase());
        let n = 0;
        for(const b of toBuy){ if(existing.includes(b.name.toLowerCase())) continue; await S.db.collection("extras").doc(uid("x")).set({name:b.name, amount:b.amount, cat:b.meat?"Kød & fisk":b.cat, cart:false, from:r.title, at:Date.now()}); n++; }
        rb.disabled = true; rb.textContent = n ? "Sat på indkøbslisten" : "Står allerede på listen";
      };
      s.querySelector("#rSave").onclick = async () => {
        if(sid){ await S.db.doc("recipes/"+sid).delete(); toast("Fjernet fra gemte"); }
        else { await S.db.doc("recipes/"+uid("r")).set({...JSON.parse(JSON.stringify(r)), saved:Date.now()}); toast("Opskriften er gemt"); }
        close();
      };
      s.querySelector("#rCook").onclick = () => { s.querySelector("#rConfirm").hidden = false; s.querySelector("#rConfirm").scrollIntoView({behavior:"smooth",block:"nearest"}); };
      s.querySelector("#rCookNo").onclick = () => { s.querySelector("#rConfirm").hidden = true; };
      s.querySelector("#rCookYes").onclick = async () => {
        close(); busy("Opdaterer lager");
        let taken = 0;
        try{ for(const u of usesOk){ for(let i=0;i<u.packs;i++){ const x = await takeUnit(u.id,true); if(x.ok) taken++; } } }catch{}
        busy(false); toast(taken ? `${taken} enheder trukket fra lageret. Velbekomme.` : "Velbekomme.");
      };
  });
}

/* ================= toast & busy ================= */
let tTimer;
function toast(msg, canUndo){
  clearTimeout(tTimer);
  let t = $(".toast"); if(!t){ t = document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${canUndo?`<button id="undoBtn">Fortryd</button>`:""}`;
  if(canUndo) t.querySelector("#undoBtn").onclick = () => { t.remove(); undo().catch(()=>{}); };
  tTimer = setTimeout(()=>{ t.remove(); if(canUndo) S.undo=null; }, canUndo ? 7000 : 3400);
}
function busy(msg){
  let b = $(".busy"); if(!msg){ b && b.remove(); return; }
  if(!b){ b = document.createElement("div"); b.className="busy"; document.body.appendChild(b); }
  b.innerHTML = `<div><span class="dots"><i></i><i></i><i></i></span>${esc(msg)}</div>`;
}

  const h = decodeURIComponent(location.hash.slice(1));
  if(/^k\d+$/.test(h)){ setBox(h); S.pendingHash = h; }
  try{ if(h && !h.startsWith("setup=")) history.replaceState(null,"",location.pathname); }catch{}
}
window.addEventListener("hashchange", () => { readHash(); if(S.ready && S.pendingHash) boxArrived(); });
function boxArrived(){
  const id = S.pendingHash; S.pendingHash = null;
  if(S.boxes[id]){ setBox(id); toast(`${S.boxes[id].name} er valgt. Scan for at lægge på lager eller tage ud.`); }
}
document.querySelectorAll(".navbtn").forEach(t => t.onclick = () => { S.tab = t.dataset.tab; store.set("bl-tab", S.tab); render(); window.scrollTo(0,0); });

/* ================= render ================= */
function render(){
  if($("#app").hidden) return;
  document.querySelectorAll(".navbtn").forEach(t=>t.setAttribute("aria-selected", t.dataset.tab===S.tab));
  const prods = productList();
  const buyP = prods.filter(p=>missing(p)>0);
  const extras = Object.entries(S.extras).map(([id,x])=>({id,...x}));
  const nb = $("#buyBadge"); const nBuy = buyP.length + extras.filter(x=>!x.cart).length; nb.hidden = !nBuy; nb.textContent = nBuy;
  if(S.box) $("#boxchipName").textContent = boxName(S.box) || "Kasse";
  $("#titleblock").hidden = S.tab==="lager";
  $("#viewTitle").textContent = TITLES[S.tab][0];
  $("#viewSub").textContent = TITLES[S.tab][1];
  let head = "";
  if(S.failed) head = `<div class="notice"><strong>Ingen forbindelse.</strong> Data kunne ikke hentes. Tjek internetforbindelsen og træk siden ned for at genindlæse.</div>`;
  else if(!S.ready) head = `<div class="notice"><span class="dots"><i></i><i></i><i></i></span>&nbsp; Henter lager</div>`;
  const body = S.tab==="lager" ? viewStock(prods) : S.tab==="indkob" ? viewBuy(buyP, extras) : S.tab==="opskrifter" ? viewRecipes() : viewBoxes(prods);
  $("#view").innerHTML = head + body;
  bindView();
}

function viewStock(prods){
  if(S.ready && !prods.length) return `<div class="empty"><h3>Spisekammeret venter</h3>
    <ol><li>Vælg <strong>Fyld op</strong> og tryk på scan-knappen.</li><li>Hold stregkoden foran kameraet. Varen slås op, og du giver den et generelt navn og et måltal.</li><li>Når I tager noget, vælg <strong>Tag ud</strong> og scan. Varen kommer på indkøbslisten.</li></ol>
    <div class="btnrow"><button class="btn" id="addManual">Tilføj manuelt</button></div></div>`;
  const q = S.query.trim().toLowerCase();
  const list = q ? prods.filter(p=>p.name.toLowerCase().includes(q)) : prods;
  const need = prods.filter(p=>missing(p)>0).length;
  const soon = expRows().filter(r=>["gone","soon"].includes(expState(r.u.e)));
  const units = prods.reduce((s,p)=>s+stock(p),0);
  const full = prods.filter(p=>!missing(p)).length;
  const summary = need || soon.length ? [need?`${need} ${need===1?"vare mangler":"varer mangler"}`:"", soon.length?`${soon.length} udløber snart`:""].filter(Boolean).join(" og ")+"." : "Basislageret er fyldt op.";
  return `<div class="hero">${PLANT}
      <span class="eyebrow">${esc(new Date().toLocaleDateString("da-DK",{weekday:"long",day:"numeric",month:"long"}))}</span>
      <h2>${greeting()}</h2><p>${esc(summary)}</p>
      <div class="btnrow"><button class="btn primary small" id="heroManual">Tilføj manuelt</button></div>
    </div>
    <div class="stats">
      <div class="stat"><span class="ic">${IC.box}</span><span class="k">På lager</span><span class="v">${units}</span><span class="s">${full} af ${prods.length} fyldt op</span></div>
      <button class="stat" id="goBuy"><span class="ic">${IC.bag}</span><span class="k">Mangler</span><span class="v">${need}</span><span class="s">på indkøbslisten</span></button>
      <button class="stat" id="goExp"><span class="ic">${IC.clock}</span><span class="k">Udløber</span><span class="v">${soon.length}</span><span class="s">i år eller før</span></button>
    </div>
    <div class="searchbox">${IC.search}<input class="search" id="search" type="search" placeholder="Søg i lageret" value="${esc(S.query)}" autocomplete="off"></div>
    <div class="toolbar"><p><span class="num">${prods.length}</span> basisvarer</p><button class="btn small" id="addManual">+ Tilføj manuelt</button></div>
    ${byCat(list).map(([c,ps])=>`<section class="card"><div class="ghead"><h2>${esc(c)}</h2><span class="num">${ps.length}</span></div><div class="rows">${ps.map(p=>{
      const n = stock(p), t = p.target||0, cls = n===0&&t>0 ? "out" : n<t ? "low" : "";
      const pct = t ? Math.min(100, Math.round(n/t*100)) : (n?100:0);
      const ex = nextExp(p);
      return `<div class="row"><button class="main" data-prod="${p.id}"><span class="name">${esc(p.name)}</span><span class="bar ${cls}"><i style="width:${pct}%"></i></span>${ex?`<span class="meta">${expLabel(ex)}</span>`:""}</button>
        <div class="qty"><button class="step" data-take="${p.id}" aria-label="Tag én ${esc(p.name)} ud">−</button><span class="count ${cls}">${n}<small> / ${t}</small></span><button class="step" data-add="${p.id}" aria-label="Læg én ${esc(p.name)} på lager">+</button></div></div>`;
    }).join("")}</div></section>`).join("")}
    ${q && !list.length ? `<p class="hint">Ingen varer matcher "${esc(S.query)}".</p>`:""}`;
}

function viewBuy(buyP, extras){
  const items = [
    ...buyP.map(p=>({kind:"p", id:p.id, name:p.name, cat:p.cat, cart:!!p.cart, right:`${missing(p)} stk`, meta:`${stock(p)} af ${p.target} hjemme`})),
    ...extras.map(x=>({kind:"x", id:x.id, name:x.name, cat:x.cat, cart:!!x.cart, right:x.amount||"", meta:x.from?`Til ${x.from}`:"Ekstra vare", extra:true}))
  ];
  if(S.ready && !items.length) return `<div class="empty"><h3>Intet at købe</h3><p>Basislageret er fyldt op. Når I scanner noget ud, kommer det på listen her, sorteret efter kategori.</p><div class="btnrow"><button class="btn" id="addExtra">+ Tilføj ekstra vare</button></div></div>`;
  const done = extras.filter(x=>x.cart).length;
  return `<div class="toolbar"><p><span class="num">${items.length}</span> varer</p><div class="btnrow"><button class="btn small" id="addExtra">+ Ekstra</button><button class="btn small" id="copyList">Kopiér</button></div></div>
    ${byCat(items).map(([c,is])=>`<section class="card"><div class="ghead"><h2>${esc(c)}</h2><span class="num">${is.length}</span></div><div class="rows">${is.map(i=>`
      <div class="row ${i.cart?"done":""}"><button class="check" role="checkbox" aria-checked="${i.cart}" data-cart="${i.kind}:${i.id}" aria-label="I kurven">${i.cart?"✓":""}</button>
      <div class="main"><span class="name">${esc(i.name)}${i.extra?`<span class="tag">Ekstra</span>`:""}</span><span class="meta">${esc(i.meta)}</span></div><span class="need">${esc(i.right)}</span></div>`).join("")}</div></section>`).join("")}
    <div class="btnrow" style="margin-top:22px">${done?`<button class="btn small" id="clearExtras">Fjern ${done} afkrydsede ekstra</button>`:""}</div>
    <p class="hint" style="margin-top:12px">Basisvarer forsvinder af sig selv, når I scanner dem ind derhjemme. Ekstra varer fjernes med knappen ovenfor.</p>
    <textarea id="copyArea" hidden readonly style="width:100%;height:160px;margin-top:12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);padding:10px"></textarea>`;
}

/* ================= manual entry: one simple screen ================= */
function openManualSheet(){
  const M = { mode: S.mode, q:"", pid:null, isNew:false, qty:1, cat:"Konserves", target:2, exp:"" };
  const prods = () => productList().sort((a,b)=>a.name.localeCompare(b.name,"da"));
  sheet(`<h3>Tilføj manuelt</h3>
    <div class="choice" role="group" aria-label="Hvad vil du gøre"><button data-m="fill">Læg på lager</button><button data-m="take">Tag ud</button></div>
    <div id="mBody" style="display:grid;gap:16px"></div>`, s => {
    const body = s.querySelector("#mBody");
    const setMode = m => { M.mode = m; s.querySelectorAll("[data-m]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===m)); draw(); };
    s.querySelectorAll("[data-m]").forEach(b => b.onclick = () => setMode(b.dataset.m));
    function draw(keepFocus){
      const p = M.pid ? S.products[M.pid] : null;
      let pick;
      if(p) pick = `<div class="picked"><div><strong>${esc(p.name)}</strong><div class="pm">${stock(p)} af ${p.target||0} på lager</div></div><button class="btn small" id="mChange">Skift</button></div>`;
      else if(M.isNew) pick = `<div class="picked"><div><strong>${esc(M.q)}</strong><div class="pm">Ny basisvare</div></div><button class="btn small" id="mChange">Skift</button></div>
        <div class="two"><div class="field"><label for="mCat">Kategori</label><select id="mCat">${catOptions(M.cat)}</select></div>
        <div class="field"><label for="mTarget">Skal altid have</label><input id="mTarget" type="number" min="0" inputmode="numeric" value="${M.target}"></div></div>`;
      else {
        const q = M.q.trim().toLowerCase();
        const list = prods().filter(x => !q || x.name.toLowerCase().includes(q)).slice(0, q ? 8 : 6);
        const exact = prods().some(x => x.name.toLowerCase() === q);
        pick = `<div class="field"><label for="mQ">Vare</label><input id="mQ" type="search" autocomplete="off" placeholder="Søg eller skriv en ny vare" value="${esc(M.q)}"></div>
          ${(list.length || (q && !exact)) ? `<div class="picklist">${list.map(x=>`<button data-pid="${x.id}"><span>${esc(x.name)}</span><span class="pm">${stock(x)} / ${x.target||0}</span></button>`).join("")}
          ${q && !exact && M.mode==="fill" ? `<button id="mNew"><span class="new">+ Opret "${esc(M.q.trim())}"</span><span class="pm">ny vare</span></button>`:""}</div>`
          : `<p class="hint">${M.mode==="take" ? "Der er ingen varer på lager endnu." : "Skriv navnet på varen, fx Hakkede tomater."}</p>`}`;
      }
      const ready = !!(p || M.isNew);
      const max = M.mode==="take" && p ? stock(p) : 99;
      if(M.qty > Math.max(1,max)) M.qty = Math.max(1,max);
      body.innerHTML = pick + (ready ? `
        <div class="field"><span class="flabel">Antal</span><div class="bigqty"><button class="step" id="mMinus" aria-label="Færre">−</button><span class="n" id="mQty">${M.qty}</span><button class="step" id="mPlus" aria-label="Flere">+</button></div></div>
        ${M.mode==="fill" ? `<div class="two"><div class="field"><label for="mExp">Holdbar til (år)</label><select id="mExp">${yearOptions(M.exp)}</select></div><div class="field"><label for="mBox">Kasse</label><select id="mBox">${boxOptions(S.box)}</select></div></div>` : ""}
        ${M.mode==="take" && p && !stock(p) ? `<p class="hint">Varen står ikke på lager.</p>` : ""}
        <div style="display:grid;gap:8px"><button class="btn primary wide" id="mGo" ${M.mode==="take" && p && !stock(p) ? "disabled":""}>${M.mode==="fill" ? `Læg ${M.qty} på lager` : `Tag ${M.qty} ud`}</button>
        <button class="btn wide" id="mMore">Gem og tilføj næste</button></div>` : "");
      bind(keepFocus);
    }
    function bind(keepFocus){
      const q = body.querySelector("#mQ");
      if(q){ q.oninput = e => { M.q = e.target.value; const pos = e.target.selectionStart; draw(); const n = body.querySelector("#mQ"); n.focus(); n.setSelectionRange(pos,pos); };
             if(keepFocus!==false) setTimeout(()=>{ try{ q.focus(); }catch{} }, 120); }
      body.querySelectorAll("[data-pid]").forEach(b => b.onclick = () => { M.pid = b.dataset.pid; M.isNew = false; M.qty = 1; draw(false); });
      const nw = body.querySelector("#mNew"); if(nw) nw.onclick = () => { M.isNew = true; M.pid = null; M.q = M.q.trim(); draw(false); };
      const ch = body.querySelector("#mChange"); if(ch) ch.onclick = () => { M.pid = null; M.isNew = false; draw(); };
      const c = body.querySelector("#mCat"); if(c) c.onchange = e => M.cat = e.target.value;
      const t = body.querySelector("#mTarget"); if(t) t.oninput = e => M.target = Math.max(0, parseInt(e.target.value)||0);
      const ex = body.querySelector("#mExp"); if(ex) ex.onchange = e => M.exp = e.target.value;
      const label = () => { const g = body.querySelector("#mGo"); if(g) g.textContent = M.mode==="fill" ? `Læg ${M.qty} på lager` : `Tag ${M.qty} ud`; body.querySelector("#mQty").textContent = M.qty; };
      const mi = body.querySelector("#mMinus"); if(mi) mi.onclick = () => { M.qty = Math.max(1, M.qty-1); label(); };
      const pl = body.querySelector("#mPlus"); if(pl) pl.onclick = () => { const p = M.pid && S.products[M.pid]; const max = M.mode==="take" && p ? Math.max(1,stock(p)) : 99; M.qty = Math.min(max, M.qty+1); label(); };
      const go = body.querySelector("#mGo"); if(go) go.onclick = () => save(false);
      const more = body.querySelector("#mMore"); if(more) more.onclick = () => save(true);
    }
    async function save(again){
      if(!S.db) return noDb();
      const bx = body.querySelector("#mBox"); const box = bx ? bx.value : "";
      try{
        let pid = M.pid;
        if(M.isNew){
          pid = uid("p");
          await S.db.doc("products/"+pid).set({ name:M.q, cat:M.cat, target:M.target, units:[], cart:false, created:Date.now() });
          S.products[pid] = { name:M.q, cat:M.cat, target:M.target, units:[], cart:false };
        }
        if(M.mode==="fill") await addUnits(pid, M.qty, M.exp, box);
        else { let n=0; for(let i=0;i<M.qty;i++){ const r = await takeUnit(pid, true); if(r.ok) n++; } const p = S.products[pid];
               toast(`${p.name} −${n} · ${stock(p)} tilbage${missing(p)?" · på indkøbslisten":""}`); }
      }catch{ return; }
      if(again){ Object.assign(M, { q:"", pid:null, isNew:false, qty:1, exp:"" }); draw(); }
      else close();
    }
    setMode(M.mode);
  });
}
$("#manualBtn").onclick = () => openManualSheet();

function bindView(){
  const v = $("#view");
  const on = (sel, fn) => { const el = v.querySelector(sel); if(el) el.onclick = fn; };
  v.querySelectorAll("[data-prod]").forEach(b=>b.onclick=()=>openProductSheet(b.dataset.prod));
  v.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>takeUnit(b.dataset.take).catch(()=>{}));
  v.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openFillSheet(b.dataset.add,1));
  v.querySelectorAll("[data-box]").forEach(b=>b.onclick=()=>openBoxSheet(b.dataset.box));
  v.querySelectorAll("[data-recipe]").forEach(b=>b.onclick=()=>openRecipe(b.dataset.recipe));
  v.querySelectorAll("[data-libstyle]").forEach(b=>b.onclick=()=>{ S.libStyle = S.libStyle===b.dataset.libstyle ? "" : b.dataset.libstyle; render(); });
  v.querySelectorAll("[data-cart]").forEach(b=>b.onclick=async()=>{
    const [k,id] = b.dataset.cart.split(":");
    try{
      if(k==="p"){ const p=plain(S.products[id]); p.cart=!p.cart; await saveProduct(id,p); }
      else { const x=plain(S.extras[id]); x.cart=!x.cart; await S.db.doc("extras/"+id).set(x); }
    }catch{}
  });
  on("#addManual", ()=>openManualSheet());
  on("#heroManual", ()=>openManualSheet());
  on("#addBox", ()=>openBoxSheet(null));
  on("#addExtra", openExtraSheet);
  on("#goBuy", ()=>{ S.tab="indkob"; render(); window.scrollTo(0,0); });
  on("#goExp", openExpSheet);
  on("#heroFill", ()=>{ setMode("fill"); openScanner(); });
  on("#heroTake", ()=>{ setMode("take"); openScanner(); });
  on("#gMinus", ()=>{ S.gen.serves=Math.max(1,S.gen.serves-1); $("#gServes").textContent=S.gen.serves; });
  on("#gPlus", ()=>{ S.gen.serves=Math.min(12,S.gen.serves+1); $("#gServes").textContent=S.gen.serves; });
  on("#gGo", generate);
  on("#gSetup", openSettings);
  on("#gStop", ()=>S.gen.ctl?.abort());
  on("#clearExtras", async ()=>{ for(const [id,x] of Object.entries(S.extras)) if(x.cart) await S.db.doc("extras/"+id).delete(); });
  const w = v.querySelector("#gWish"); if(w) w.oninput = e => { S.gen.wish = e.target.value; };
  const s = v.querySelector("#search"); if(s) s.oninput = e => { S.query = e.target.value; const pos=e.target.selectionStart; render(); const n=$("#search"); n.focus(); n.setSelectionRange(pos,pos); };
  on("#copyList", async () => {
    const items = [...productList().filter(p=>missing(p)>0&&!p.cart).map(p=>({name:p.name,cat:p.cat,amt:missing(p)+" stk"})), ...Object.values(S.extras).filter(x=>!x.cart).map(x=>({name:x.name,cat:x.cat,amt:x.amount}))];
    const text = byCat(items).map(([c,is])=>c.toUpperCase()+"\n"+is.map(i=>`- ${i.name}${i.amt?" ("+i.amt+")":""}`).join("\n")).join("\n\n");
    try{ await navigator.clipboard.writeText(text); toast("Indkøbslisten er kopieret"); }
    catch{ const ta=$("#copyArea"); ta.hidden=false; ta.value=text; ta.select(); toast("Listen er markeret. Kopiér den manuelt."); }
  });
}

/* ================= boot ================= */
async function boot(){
  $("#gate").hidden = true; $("#app").hidden = false;
  $("#today").textContent = new Date().toLocaleDateString("da-DK",{weekday:"long",day:"numeric",month:"long"});
  setMode(store.get("bl-mode")==="take" ? "take" : "fill");
  S.tab = Object.keys(TITLES).includes(store.get("bl-tab")) ? store.get("bl-tab") : "lager";
  const savedBox = store.get("bl-box"); if(savedBox) setBox(savedBox);
  readHash();
  render();
  const { db, loadAll } = makeDb(S.sb);
  S.db = db;
  const coll = (name, key) => db.collection(name).onSnapshot(s => { const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S[key]=o; refresh(); });
  ["products","codes","boxes","extras","recipes"].forEach(n=>coll(n,n));
  db.doc("meta/suggestions").onSnapshot(d => { if(d.exists) S.suggest = d.data(); refresh(); });
  try{ await loadAll(); S.ready = true; S.failed = false; if(S.box && !S.boxes[S.box]) setBox(""); if(S.pendingHash) boxArrived(); }
  catch(e){ S.failed = true; if(e && (e.code==="PGRST301" || /JWT|auth/i.test(e.message||""))) return gateLogin("Log ind igen."); if(e && e.code==="42P01") S.failed = true; }
  refresh();
}
function refresh(){ const a=document.activeElement; if(a && a.closest && a.closest("#view") && a.matches("input")) return; render(); }

start();
})();
</script>
